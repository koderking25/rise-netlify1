# Cloudflare Workers configuration.
#
# This project deploys as a Worker with static assets (`npx wrangler deploy`),
# not as a Pages project. That distinction matters: the `functions/` directory
# convention is Pages-only, so without a real Worker entry point the API route
# simply does not exist and Cloudflare correctly refuses to accept environment
# variables — there is no runtime code for them to reach.
#
# `main` below is what turns this from "static files" into "static files plus a
# server", which is what makes ANTHROPIC_API_KEY settable and /api/ai-search
# real.

name = "rise-netlify1"
main = "src/index.js"
compatibility_date = "2026-08-04"
compatibility_flags = ["nodejs_compat"]

# The hostnames this Worker answers on.
#
# These are Custom Domains, not routes: `custom_domain = true` tells Cloudflare
# the Worker IS the origin for the hostname, so Cloudflare creates the DNS
# record and issues the certificate itself.
#
# This block exists because on 19 September 2026 rise4impact.org went fully
# dark: the zone was still on Cloudflare and the registration was paid up to
# 2027, but every DNS record at the apex had been removed, so the name did not
# resolve at all. Nothing was wrong with the site; there was simply no longer a
# record pointing at it. When the binding lives only in the dashboard, deleting
# it there is silent and total, and nothing in the repo can restore it.
#
# Keeping it here makes `wrangler deploy` the repair: the record is recreated
# from committed configuration rather than from memory of which dashboard
# checkbox to tick.
#
# A Custom Domain matches one exact hostname. Wildcards are not supported, so
# the apex and www each need their own entry. This must stay ABOVE [assets]:
# TOML would otherwise read it as a key inside that table rather than a
# top-level route list, and the Worker would deploy with no hostname at all.
routes = [
  { pattern = "rise4impact.org", custom_domain = true },
  { pattern = "www.rise4impact.org", custom_domain = true }
]

[assets]
# The app itself. Matches the repo layout: index.html and the favicons.
directory = "./public"
# The Worker reaches the files through this binding, so it can serve the site
# for every path it doesn't handle itself.
binding = "ASSETS"
# RISE routes in the client, so a deep link should still return the app rather
# than a 404 page.
not_found_handling = "single-page-application"
# Static assets are normally served before the Worker ever runs, which is why
# the maintenance lock did not take: "/" matched index.html and was answered by
# the asset server directly, while "/api/*" matched nothing and fell through to
# the Worker. With this set, the Worker sees every request first and can hold
# the whole site closed.
run_worker_first = true

# ── Shared state for the two safety counters ──────────────────────────────
#
# Both guards used to live in module scope, which on Workers means one copy per
# isolate. Cloudflare runs many isolates across many colos and starts fresh ones
# freely, each beginning at zero. So DAILY_BUDGET_USD=5 meant five dollars per
# isolate per day rather than five dollars a day, and the 40-per-minute rate
# limit was 40 per isolate. Traffic arriving from several countries at once got
# a fresh allowance in each one. The code said as much: "best-effort per-isolate
# throttle". That was honest, and it was also the whole problem.
#
# KV holds the running daily spend. It is eventually consistent, roughly a
# minute, so the cap can be overshot slightly at the boundary. That is an
# acceptable trade for a dollar guard backed by a hard limit on the Anthropic
# account, and it is enormously better than no shared state at all.
[[kv_namespaces]]
binding = "RISE_GUARD"
id = "b7bd25e8d0d9463588240f1d2f331e19"

# The per-IP limit gets Cloudflare's purpose-built rate limiter instead, which
# counts properly at the edge. A fuzzy rate limit is what would let a fuzzy
# dollar cap be exploited, so this is the half that needs to be exact.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 40, period = 60 }

[vars]
# Not a secret, so it lives here where it is visible in the repo rather than in
# the secret store. Without it the CORS header falls back to "*", meaning any
# website could call this proxy from a visitor's browser and spend the Anthropic
# budget. Worth setting, and worth being clear that it is not the protection:
# CORS is enforced by browsers, and anything scripted ignores it entirely. The
# spend cap above is the protection.
ALLOW_ORIGIN = "https://rise4impact.org,https://www.rise4impact.org"

# ── Keep the database awake ───────────────────────────────────────────────
#
# Supabase pauses Free-plan projects after seven days of low activity, and the
# project currently shows zero Postgres requests. A paused database does not
# announce itself: sign-in breaks, the organization form breaks, and the first
# anyone knows is a visitor saying the site is broken. The failure mode that
# matters is a school opening the link days after Rayan emails it.
#
# One trivial query a day is enough to prevent it. 12:00 UTC is mid-morning in
# Ontario, so if the ping itself ever breaks, it breaks during the day.
#
# This is a stopgap, not the answer. The Pro plan is the answer, because it
# also brings the daily backups that do not exist today.
[triggers]
crons = ["0 12 * * *"]

[observability]
enabled = true

# Secrets are NOT set here — this file is committed. Set them with either:
#   npx wrangler secret put ANTHROPIC_API_KEY
# or the dashboard: Settings → Variables and secrets → Add → type "Secret".
