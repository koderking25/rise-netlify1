<!-- Fonts are fetched HERE, not via @import inside the React-injected <style>.
     An @import in that stylesheet cannot start downloading until React has been
     fetched, parsed, and mounted — measured at 628ms, which pushed first paint
     past 1.5s. Loaded from <head> the request starts during HTML parse, in
     parallel with React.

     Loaded as `media="print"` and flipped to `all` on load so it downloads
     early WITHOUT being render-blocking: a plain stylesheet link here would
     hold up first paint on every slow round-trip to Google. Combined with
     display=swap, text paints immediately in the fallback face and swaps when
     DM Sans arrives. The <noscript> keeps it working with JS disabled. -->
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"/>
<link rel="stylesheet" media="print" id="rise-fonts" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"/>
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap"/></noscript>
<!-- Mirrors COPY.metaDesc for the current GLOBAL_MODE. The app also rewrites

     when you flip GLOBAL_MODE flip this line too:
     "Born in Canada. Reaching the world. RISE matches young people aged 14-18 to real volunteer roles that need their specific talents — locally or anywhere in the world." -->
<meta name="description" content="RISE matches Canadian students aged 14-18 with volunteer opportunities that fit their talents. Track your 40 hours. Turn talent into impact."/>
<script src="/react.18.2.0.js"></script>
<script src="/react-dom.18.2.0.js"></script>
<script>
  /* Applies the saved theme before the first paint.

     RISE opens light and ignores the device's colour scheme: someone who
     never asked for a dark site should not be given one. But a person who
     did turn dark mode on should not get a bright flash on every visit while
     React boots, so their choice is read here, synchronously, ahead of any
     rendering. Nothing else runs this early, which is the whole point.

     Reads the same `rise_cfg` record the Settings toggle writes, so there is
     one stored preference rather than a second copy to drift. */
  (function () {
    try {
      var cfg = JSON.parse(localStorage.getItem("rise_cfg") || "{}");
      if (cfg && cfg.darkMode === true) {
        document.documentElement.setAttribute("data-theme", "dark");
        document.documentElement.style.colorScheme = "dark";
      }
    } catch (e) {}

    /* The font sheet loads as media="print" so it does not block the first
       paint, then is promoted to all once it has arrived. That promotion used
       to be an inline onload="" attribute on the link. Inline handlers are
       exactly what an injected script relies on, so the Content-Security-
       Policy refuses them, and this file must not contain one. Doing it here
       keeps the same behaviour inside the single inline block the policy
       allows by hash. */
    try {
      var f = document.getElementById("rise-fonts");
      if (f) f.addEventListener("load", function () { f.media = "all"; }, { once: true });
    } catch (e) {}
  })();
</script>
<style>
  /* The boot splash paints before React exists. It follows the saved choice
     applied by the script above, and defaults to light — deliberately not to
     `prefers-color-scheme`, which is what used to hand people a dark site
     they had not asked for. */
  html, body { background: #F4F1EB; }
  html[data-theme="dark"], html[data-theme="dark"] body { background: #0C0906; }
  html[data-theme="dark"] #rise-splash { background: #0C0906 !important; color: #F5EDE3 !important; }
  html[data-theme="dark"] #rise-splash div[style*="8a7a6a"] { color: #B8A08A !important; }
</style>
</head>
<body>
<div id="root">
  <div id="rise-splash" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-family:sans-serif;background:#FAF7F2;color:#1A0E06">
    <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#D6560C,#F97316);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:22px">R</div>
    <div style="font-size:14px;color:#8a7a6a">Loading RISE…</div>
    <div id="rise-boot-error" style="display:none;max-width:340px;text-align:center;font-size:13px;color:#B03232;line-height:1.6">
      Couldn't load the app libraries. Check your internet connection and refresh the page.
    </div>
  </div>
</div>
